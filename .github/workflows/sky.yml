name: Living scene

on:
  schedule:
    - cron: "23 */3 * * *"
  workflow_dispatch:
    inputs:
      weather:
        description: "Pin the weather — clear/clouds/rain/snow/fog/storm. Blank uses the real forecast."
        required: false
        default: ""
      season:
        description: "Pin the season — spring/summer/autumn/winter. Blank uses today's date."
        required: false
        default: ""
      force:
        description: "Re-render even if the scene has not changed"
        required: false
        default: "false"

permissions:
  contents: write

jobs:
  scene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: yuki4266/living-scene@v1
        with:
          lat: "39.9042"        # Beijing, China
          lon: "116.4074"
          tz: Asia/Shanghai
          weather: ${{ inputs.weather }}
          season: ${{ inputs.season }}
          force: ${{ inputs.force }}
          commit-message: "🌦 scene sync: {state}"

      - name: Remove scene status label
        shell: bash
        run: |
          sed -i -E 's#<text x="893" y="64"[^>]*>LIVE SKY · [^<]*</text>##g' sky.svg sky-night.svg
          git diff --quiet -- sky.svg sky-night.svg && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sky.svg sky-night.svg
          git commit -m "Remove scene status label"
          git push
